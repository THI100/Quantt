name: Build and Release Quantt

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            electron_target: win
          - os: ubuntu-latest
            platform: linux
            electron_target: linux
          - os: macos-latest
            platform: macos
            electron_target: mac

    steps:
      - name: Checkout UI repository
        uses: actions/checkout@v4
        with:
          path: quantt-ui

      - name: Checkout Python engine repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ENGINE_REPOSITORY }}
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          path: quantt-engine

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: quantt-ui/package-lock.json

      - name: Install Python dependencies
        working-directory: quantt-engine
        shell: bash
        run: |
          python -m pip install --upgrade pip

          python -m pip install .

          python -m pip install pyinstaller

      - name: Install UI dependencies
        working-directory: quantt-ui
        run: npm ci

      - name: Build Python engine
        working-directory: quantt-engine
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            python -m PyInstaller \
              --noconfirm \
              --clean \
              --onedir \
              --windowed \
              --icon ./build/qi.ico \
              --noupx \
              --name QuanttEngine \
              main.py
          else
            python -m PyInstaller \
              --noconfirm \
              --clean \
              --onedir \
              --noupx \
              --name QuanttEngine \
              main.py
          fi

      - name: Build Vite frontend
        working-directory: quantt-ui
        run: npm run build_ft

      - name: Package Electron application
        working-directory: quantt-ui
        run: >
          npm run build_electron --
          --${{ matrix.electron_target }}
          --publish never

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: Quantt-${{ matrix.platform }}
          path: quantt-ui/e_dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Archive built engine for smoke test
        run: tar -czf quantt-engine-smoke.tar.gz -C quantt-engine/dist QuanttEngine

      - name: Upload built engine for smoke test
        uses: actions/upload-artifact@v4
        with:
          name: engine-smoke-${{ matrix.platform }}
          path: quantt-engine-smoke.tar.gz
          if-no-files-found: error
          retention-days: 1

  test:
    name: Smoke test (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            executable: QuanttEngine.exe
          - os: ubuntu-latest
            platform: linux
            executable: QuanttEngine
          - os: macos-latest
            platform: macos
            executable: QuanttEngine

    steps:
      - name: Checkout UI repository
        uses: actions/checkout@v4
        with:
          path: quantt-ui

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: quantt-ui/package-lock.json

      - name: Install UI dependencies
        working-directory: quantt-ui
        run: npm ci

      - name: Build frontend for Electron
        working-directory: quantt-ui
        run: npm run build_ft

      - name: Download built engine
        uses: actions/download-artifact@v4
        with:
          name: engine-smoke-${{ matrix.platform }}
          path: smoke-engine

      - name: Extract built engine
        run: tar -xzf smoke-engine/quantt-engine-smoke.tar.gz -C quantt-engine/dist

      - name: Run Electron and backend smoke test (Linux)
        if: runner.os == 'Linux'
        working-directory: quantt-ui
        env:
          QUANTT_ENGINE_EXECUTABLE: ${{ github.workspace }}/quantt-engine/dist/QuanttEngine/${{ matrix.executable }}
        run: xvfb-run -a node scripts/smoke-test.js

      - name: Run Electron and backend smoke test
        if: runner.os != 'Linux'
        working-directory: quantt-ui
        env:
          QUANTT_ENGINE_EXECUTABLE: ${{ github.workspace }}/quantt-engine/dist/QuanttEngine/${{ matrix.executable }}
        run: node scripts/smoke-test.js

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Quantt-*
          merge-multiple: true
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
